version: "{branch}.build.{build}"
skip_tags: true

branches:
  only:
    - develop

clone_folder: c:\projects\php_printer

install:
  ps: |

    echo "Build cache directory c:\build-cache"
    if (-not (Test-Path c:\build-cache)) {
            mkdir c:\build-cache
    }

    echo "Download PHP SDK binary tools"
    $bname = 'php-sdk-binary-tools-php-sdk-' + $env:BIN_SDK_VER + '.zip'
    $bpath = 'php-sdk-' + $env:BIN_SDK_VER
    echo "Downloading: https://github.com/php/php-sdk-binary-tools/releases/download/$bpath/$bname"
    if (-not (Test-Path c:\build-cache\$bname)) {
            Invoke-WebRequest "https://github.com/php/php-sdk-binary-tools/releases/download/$bpath/$bname" -OutFile "c:\build-cache\$bname"
    }
    $dname0 = 'php-sdk-binary-tools-php-sdk-' + $env:BIN_SDK_VER
    $dname1 = 'php-sdk-' + $env:BIN_SDK_VER
    if (-not (Test-Path c:\build-cache\$dname1)) {
            7z x c:\build-cache\$bname -oc:\build-cache
            Start-Sleep -s 5
            move c:\build-cache\$dname0 c:\build-cache\$dname1
    }

cache:
  c:\build-cache -> .appveyor.yml

environment:
  BIN_SDK_VER: 2.3.0
  matrix:
    - APPVEYOR_BUILD_WORKER_IMAGE: Visual Studio 2022
      ARCH: x64
      VC: vs17
      PHP_VER: 8.4.17
      TS: 1

build_script:
  ps: |

    $ts_part = ''
    if ('0' -eq $env:TS) { $ts_part = '-nts' }

    $sdk_root   = 'c:\build-cache\php-sdk-' + $env:BIN_SDK_VER
    $deps_dir   = 'c:\build-cache\deps-' + $env:PHP_VER.substring(0,3) + '-' + $env:VC + '-' + $env:ARCH + $ts_part
    $php_src_dir = 'c:\projects\php-src'

    # Download PHP source if not present
    if (-not (Test-Path "$php_src_dir\buildconf.bat")) {
            echo "Downloading PHP source..."
            if (Test-Path $php_src_dir) {
                Remove-Item -Recurse -Force $php_src_dir
            }
            $php_branch = 'PHP-' + $env:PHP_VER.substring(0,3)
            echo "Cloning PHP branch: $php_branch"
            git clone --depth 1 --branch $php_branch https://github.com/php/php-src.git $php_src_dir
            if ($LASTEXITCODE -ne 0) {
                echo "Failed to clone PHP source"
                exit 1
            }
    }

    # Copy extension source to PHP ext dir
    echo "Copying extension source to PHP ext dir..."
    if (Test-Path "$php_src_dir\ext\php_printer") {
        Remove-Item -Recurse -Force "$php_src_dir\ext\php_printer"
    }
    xcopy c:\projects\php_printer $php_src_dir\ext\php_printer\ /s /e /y /i /q

    # Download devel-pack (headers + libs reference)
    $bname = 'php-devel-pack-' + $env:PHP_VER + $ts_part + '-Win32-' + $env:VC.toUpper() + '-' + $env:ARCH + '.zip'
    if (-not (Test-Path c:\build-cache\$bname)) {
            Invoke-WebRequest "https://downloads.brittainmedia.co.uk/$bname" -OutFile "c:\build-cache\$bname"
    }

    $devpack_dir = 'c:\build-cache\php-' + $env:PHP_VER + $ts_part + '-devel-' + $env:VC.toUpper() + '-' + $env:ARCH
    if (-not (Test-Path $devpack_dir)) {
            7z x c:\build-cache\$bname -o"c:\build-cache"
    }

    # Create a batch script with all build commands
    $build_script_path = "c:\build-cache\build-commands.bat"
    $script_content = "@echo off`r`n"
    $script_content += "echo ====================================`r`n"
    $script_content += "echo Starting PHP Extension Build`r`n"
    $script_content += "echo ====================================`r`n"
    $script_content += "cd /d c:\projects\php-src`r`n"
    $script_content += "if errorlevel 1 (`r`n"
    $script_content += "    echo ERROR: Failed to change directory to c:\projects\php-src`r`n"
    $script_content += "    exit /b 1`r`n"
    $script_content += ")`r`n"
    $script_content += "`r`n"
    $script_content += "echo.`r`n"
    $script_content += "echo Running phpsdk_deps...`r`n"
    $script_content += "phpsdk_deps --update --branch $($env:PHP_VER.substring(0,3)) --deps $deps_dir --stability stable`r`n"
    $script_content += "if errorlevel 1 (`r`n"
    $script_content += "    echo ERROR: phpsdk_deps failed`r`n"
    $script_content += "    exit /b 1`r`n"
    $script_content += ")`r`n"
    $script_content += "`r`n"
    $script_content += "echo.`r`n"
    $script_content += "echo Running buildconf...`r`n"
    $script_content += "buildconf.bat --force`r`n"
    $script_content += "if errorlevel 1 (`r`n"
    $script_content += "    echo ERROR: buildconf failed`r`n"
    $script_content += "    exit /b 1`r`n"
    $script_content += ")`r`n"
    $script_content += "`r`n"
    $script_content += "echo.`r`n"
    $script_content += "echo Running configure...`r`n"
    $script_content += "configure.bat --enable-printer=shared --enable-debug --with-php-build=`"$deps_dir`" --disable-test-ini`r`n"
    $script_content += "if errorlevel 1 (`r`n"
    $script_content += "    echo ERROR: configure failed`r`n"
    $script_content += "    exit /b 1`r`n"
    $script_content += ")`r`n"
    $script_content += "`r`n"
    $script_content += "echo.`r`n"
    $script_content += "echo Running nmake...`r`n"
    $script_content += "nmake /NOLOGO`r`n"
    $script_content += "if errorlevel 1 (`r`n"
    $script_content += "    echo ERROR: nmake failed`r`n"
    $script_content += "    exit /b 1`r`n"
    $script_content += ")`r`n"
    $script_content += "`r`n"
    $script_content += "echo.`r`n"
    $script_content += "echo ====================================`r`n"
    $script_content += "echo Build completed successfully!`r`n"
    $script_content += "echo ====================================`r`n"
    [System.IO.File]::WriteAllText($build_script_path, $script_content)

    # Execute the build script within the SDK environment
    $starter = Join-Path $sdk_root "phpsdk-$($env:VC)-$($env:ARCH).bat"
    & cmd /c "$starter -t $build_script_path"
    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

after_build:
  ps: |

    $ts_part = 'ts'
    if ('0' -eq $env:TS) { $ts_part = 'nts' }

    $zip_bname = 'php_printer-' + $env:APPVEYOR_REPO_COMMIT.substring(0,8) + '-' + $env:PHP_VER.substring(0,3) + '-' + $ts_part + '-' + $env:VC + '-' + $env:ARCH + '.zip'

    $build_dir = 'c:\projects\php-src\' + $env:ARCH + '\Release'
    if ('1' -eq $env:TS) { $build_dir += '_TS' }

    if (-not (Test-Path $build_dir\php_printer.dll)) {
      Write-Error "Extension DLL not found at $build_dir\php_printer.dll"
      exit 1
    }

    & 7z a c:\$zip_bname $build_dir\php_printer.dll
    Push-AppveyorArtifact c:\$zip_bname

test_script:
  ps: |
    echo "Start tests... (add php_printer.dll loading + run tests here if you have them)"